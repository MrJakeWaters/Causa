plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.apache.commons:commons-lang3:3.17.0'
	implementation 'org.neo4j.driver:neo4j-java-driver:5.28.4'
    	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0' // Or the latest version     
	implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'     
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0' // Use the latest version
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.json:json:20250517'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
    testLogging.showStandardStreams = true
    testLogging.exceptionFormat = 'full'
}
